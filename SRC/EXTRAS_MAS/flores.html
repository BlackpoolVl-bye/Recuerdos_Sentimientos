<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarrilas</title>
    <link rel="stylesheet" href="/CSS/estilo.css">
    <link rel="stylesheet" href="/CSS/flores.css">
</head>
<body>
    <div class="mensaje-flores">
        <center><h1>Feliz 21 de septiembre</h1></center>
    <p>Hoy, 21 de septiembre, celebro tu luz con flores amarillas hechas con amor...... Que cada pétalo te abrace y te recuerde lo valiosa que eres para mí..... Eres mi alegría, mi inspiración y mi razón para sonreír cada día.</p>
    </div>
    <div class="flores-svg">
        <!-- Flor amarilla 1 -->
        <svg class="flor-svg" viewBox="0 0 100 600">
            <g>
                <rect x="46" y="180" width="8" height="400" rx="4" fill="#388e3c"/>
                <!-- Hoja izquierda -->
                <path d="M20 420 Q35 390 50 420 Q35 430 20 420" fill="#43a047"/>
                <!-- Hoja derecha -->
                <path d="M80 520 Q65 490 50 520 Q65 530 80 520" fill="#43a047"/>
                                <!-- Pétalos distribuidos alrededor del centro -->
                                <g>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(0 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(45 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(90 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(135 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(180 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(225 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(270 50 180)"/>
                                    <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(315 50 180)"/>
                                </g>
                <circle cx="50" cy="180" r="56" fill="#ffd600"/>
                <circle cx="50" cy="180" r="28" fill="#fffde7"/>
            </g>
        </svg>
        <!-- Flor amarilla 2 -->
        <svg class="flor-svg" viewBox="0 0 100 600">
            <g>
                <rect x="48" y="180" width="6" height="400" rx="3" fill="#388e3c"/>
                <!-- Hoja izquierda -->
                <path d="M15 470 Q35 440 50 470 Q35 480 15 470" fill="#43a047"/>
                <!-- Hoja derecha -->
                <path d="M85 570 Q65 540 50 570 Q65 580 85 570" fill="#43a047"/>
                    <!-- Pétalos distribuidos alrededor del centro, formas variadas -->
                                    <g>
                                        <ellipse cx="50" cy="110" rx="16" ry="38" fill="#fff176" transform="rotate(0 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="20" ry="42" fill="#ffe066" transform="rotate(36 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="14" ry="36" fill="#fff176" transform="rotate(72 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(108 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="22" ry="44" fill="#fff176" transform="rotate(144 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="15" ry="39" fill="#ffe066" transform="rotate(180 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="19" ry="41" fill="#fff176" transform="rotate(216 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="17" ry="37" fill="#ffe066" transform="rotate(252 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="21" ry="39" fill="#fff176" transform="rotate(288 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="15" ry="35" fill="#ffe066" transform="rotate(324 50 180)"/>
                                    </g>
                    </g>
                <circle cx="50" cy="180" r="48" fill="#ffd600"/>
                <circle cx="50" cy="180" r="24" fill="#fffde7"/>
            </g>
        </svg>
        <!-- Flor amarilla 3 -->
        <svg class="flor-svg" viewBox="0 0 100 600">
            <g>
                <rect x="50" y="180" width="4" height="400" rx="2" fill="#388e3c"/>
                <!-- Hoja izquierda -->
                <path d="M25 520 Q40 490 50 520 Q40 530 25 520" fill="#43a047"/>
                <!-- Hoja derecha -->
                <path d="M75 600 Q60 570 50 600 Q60 610 75 600" fill="#43a047"/>
                    <!-- Pétalos distribuidos alrededor del centro, formas variadas -->
                                    <g>
                                        <ellipse cx="50" cy="110" rx="18" ry="40" fill="#ffe066" transform="rotate(0 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="14" ry="36" fill="#fff176" transform="rotate(40 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="20" ry="42" fill="#ffe066" transform="rotate(80 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="16" ry="38" fill="#fff176" transform="rotate(120 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="22" ry="44" fill="#ffe066" transform="rotate(160 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="15" ry="39" fill="#fff176" transform="rotate(200 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="19" ry="41" fill="#ffe066" transform="rotate(240 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="17" ry="37" fill="#fff176" transform="rotate(280 50 180)"/>
                                        <ellipse cx="50" cy="110" rx="21" ry="39" fill="#ffe066" transform="rotate(320 50 180)"/>
                                    </g>
                <circle cx="50" cy="180" r="36" fill="#ffd600"/>
                <circle cx="50" cy="180" r="18" fill="#fffde7"/>
            </g>
        </svg>
    </div>
    <script src="/JavaScript/flores.js"></script>
</body>
</html>
